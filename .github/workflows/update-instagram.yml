name: Automated Instagram Feed Sync

on:
  schedule:
    # Runs automatically every hour in the background
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      shortcode:
        description: 'Specific Instagram post shortcode to sync immediately (e.g. Ddq3n-WsNCE, optional)'
        required: false
        type: string
  repository_dispatch:
    types: [instagram_sync, new_post]

permissions:
  contents: write

jobs:
  sync-instagram:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies & Playwright browser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Fetch latest Instagram posts
        env:
          INSTAGRAM_USERNAME: 'uosdigest'
          MAX_POSTS: '6'
          INSTAGRAM_SESSION: ${{ secrets.INSTAGRAM_SESSION }}
          TARGET_SHORTCODE: ${{ github.event.inputs.shortcode || github.event.client_payload.shortcode }}
        run: |
          python scripts/fetch_instagram.py

      - name: Commit and push changes if updated
        run: |
          if [ -z "$(git status --porcelain data/instagram.json assets/instagram js/data.js)" ]; then
            echo "No new posts or images to commit."
          else
            echo "New posts or images detected! Committing and pushing to repository..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/instagram.json assets/instagram/ js/data.js
            git commit -m "chore(instagram): update @uosdigest feed and assets [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
